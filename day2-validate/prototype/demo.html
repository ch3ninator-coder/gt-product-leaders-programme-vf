<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passport Ready Check: guided prototype walkthrough (synthetic data only)</title>
<!--
  Day 2 prototype walkthrough. Scenario B, ICA passport applications.
  A guided tour: a spotlight shows where to look, a guide card says what it
  means, and at key moments the viewer taps the button themselves.
  Every person, case, time and number is made up unless marked "course".
  Not a real ICA service.
  Self-contained: inline CSS and JS, no network requests. Fonts load from the
  repo's own assets/fonts folder and fall back to system fonts.
  Keys: right arrow for Next, left arrow for Back.
-->
<link rel="stylesheet" href="../../assets/fonts/ps-fonts.css">
<style>
  :root {
    color-scheme: light;
    --paper: #e6eeea;
    --paper-2: #f5f8f7;
    --ink: #102a27;
    --ink-2: #4a5f5a;
    --rule: #c3d2cc;
    --check: #2846b8;
    --check-soft: #e9edfb;
    --stamp: #b42339;
    --stamp-soft: #fbecee;
    --ok: #0f6e5a;
    --officer: #7a4e1d;
    --sans: "Saans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: "Antarctican Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --guide-w: 320px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.45;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--check); outline-offset: 2px; }

  .banner { font-size: 0.78rem; text-align: center; padding: 0.35rem 1rem; background: var(--ink); color: var(--paper-2); }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 40; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .top-in { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 1.25rem; max-width: 1180px; margin: 0 auto; }
  .top h1 { font-size: 1.05rem; font-weight: 800; margin: 0; white-space: nowrap; }
  .chapters { list-style: none; margin: 0; padding: 0; display: flex; gap: 0.3rem; overflow-x: auto; scrollbar-width: none; }
  .chapters::-webkit-scrollbar { display: none; }
  .chapters button {
    white-space: nowrap; cursor: pointer;
    border: 1px solid var(--rule); background: var(--paper-2);
    border-radius: 999px; padding: 0.25rem 0.7rem; font-size: 0.8rem;
  }
  .chapters button[aria-current="step"] { background: var(--ink); color: var(--paper-2); border-color: var(--ink); }
  .chapters button.done { color: var(--ink-2); }
  .progress { height: 3px; background: var(--rule); }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.3s; }

  /* Stage: scene on the left, a lane for the guide on the right */
  .stage { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; display: grid; grid-template-columns: minmax(0, 1fr) calc(var(--guide-w) + 40px); }
  .scene-col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .context { display: flex; align-items: baseline; justify-content: center; gap: 0.9rem; flex-wrap: wrap; margin-bottom: 0.9rem; min-height: 1.9rem; }
  .context[hidden] { display: none; }
  .who { font-size: 0.9rem; font-weight: 600; color: var(--ink-2); }
  .who[data-track="today"] { color: var(--stamp); }
  .who[data-track="check"] { color: var(--check); }
  .who[data-track="edge"] { color: var(--officer); }
  .clock { font-family: var(--mono); font-size: 0.85rem; color: var(--ink-2); padding: 0.1rem 0.45rem; border-radius: 6px; }
  .clock b { font-size: 1.15rem; color: var(--ink); }
  .clock.late b { color: var(--stamp); }
  .scene { position: relative; display: flex; justify-content: center; width: 100%; }

  /* Phone */
  .phone {
    position: relative;
    width: 300px; max-width: 100%;
    min-height: 520px;
    border: 9px solid var(--ink); border-radius: 34px;
    background: #fff;
    padding: 0.9rem 1rem 1.2rem;
    font-size: 0.92rem;
  }
  .phone::before { content: ""; display: block; width: 70px; height: 5px; border-radius: 4px; background: var(--rule); margin: -0.25rem auto 0.8rem; }
  .p-app { font-size: 0.76rem; color: var(--ink-2); border-bottom: 1px solid var(--rule); padding-bottom: 0.45rem; margin-bottom: 0.8rem; }
  .p-h { font-size: 1.15rem; font-weight: 800; line-height: 1.2; margin: 0 0 0.6rem; }
  .p-sub { color: var(--ink-2); margin: 0 0 0.8rem; }
  .p-q { font-weight: 700; margin: 0 0 0.45rem; }
  .p-prog { font-size: 0.76rem; color: var(--ink-2); margin: 0 0 0.25rem; }
  .p-list { list-style: none; margin: 0 0 0.9rem; padding: 0; }
  .p-list li { padding: 0.45rem 0.25rem; border-bottom: 1px solid #e3eae7; display: flex; gap: 0.5rem; }
  .ok { color: var(--ok); font-weight: 800; }
  .no { color: var(--stamp); font-weight: 800; }
  .flag { color: var(--check); font-weight: 800; }
  .p-btn {
    display: block; width: 100%; text-align: center; cursor: pointer;
    border: none; border-radius: 8px; padding: 0.75rem; font-weight: 700;
    background: var(--ink); color: #fff; margin-top: 0.4rem;
  }
  .p-btn.blue { background: var(--check); }
  .p-link { background: none; border: none; padding: 0; color: var(--check); text-decoration: underline; cursor: pointer; font-size: 0.86rem; display: inline-block; margin: 0 0 0.9rem; }
  .p-quiet { display: block; margin: 0.8rem 0 0 auto; background: none; border: none; padding: 0; color: var(--ink-2); text-decoration: underline; font-size: 0.82rem; cursor: pointer; }
  .p-chip { display: inline-block; font-size: 0.74rem; color: var(--check); background: var(--check-soft); border-radius: 999px; padding: 0.18rem 0.6rem; margin-bottom: 0.6rem; }
  .p-answers { display: grid; gap: 0.4rem; }
  .p-opt { text-align: left; cursor: pointer; border: 1px solid var(--rule); background: #fff; border-radius: 8px; padding: 0.6rem 0.75rem; }
  .p-opt.on { border-color: var(--check); background: var(--check-soft); font-weight: 600; }
  .p-done { font-size: 0.82rem; color: var(--ink-2); border-bottom: 1px solid #e3eae7; padding: 0.35rem 0; }
  .p-done b { color: var(--ink); }
  .p-fix { background: var(--stamp-soft); border: 1px solid #e6b7bf; border-radius: 8px; padding: 0.75rem 0.8rem; margin-bottom: 0.8rem; }
  .p-fix b { display: block; margin-bottom: 0.25rem; }
  .p-trust { font-size: 0.86rem; margin: 0.75rem 0 0.4rem; padding: 0.2rem 0.25rem; }
  .p-more { display: block; width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--rule); padding: 0.5rem 0 0; color: var(--check); font-size: 0.84rem; cursor: pointer; }
  .p-details { font-size: 0.82rem; color: var(--ink-2); padding-top: 0.4rem; }
  .p-details ul { margin: 0.2rem 0 0.4rem; padding-left: 1.1rem; }
  .toast { margin-top: 0.9rem; padding: 0.6rem 0.7rem; border-radius: 8px; background: var(--check-soft); font-size: 0.86rem; }
  .toast.done { background: #e4f1ec; }

  /* Officer desk */
  .desk { width: 560px; max-width: 100%; }
  .monitor { border: 8px solid var(--ink); border-radius: 10px; background: #fff; display: grid; grid-template-columns: 150px minmax(0, 1fr); min-height: 330px; font-size: 0.86rem; overflow: hidden; }
  .stand { width: 90px; height: 24px; margin: 0 auto; background: var(--ink); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
  .m-side { background: #f1f4f3; border-right: 1px solid var(--rule); padding: 0.75rem 0.6rem; }
  .m-side p { font-size: 0.74rem; margin: 0 0 0.45rem; color: var(--ink-2); }
  .m-side ol { list-style: none; margin: 0; padding: 0; }
  .m-side li { padding: 0.35rem 0.45rem; border-radius: 6px; margin-bottom: 0.2rem; }
  .m-side li.on { background: #fff; border: 1px solid var(--rule); font-weight: 600; }
  .m-side li.more { color: var(--ink-2); font-size: 0.75rem; }
  .m-main { padding: 0.8rem 0.9rem; }
  .m-main h3 { font-size: 1rem; margin: 0 0 0.5rem; }
  .m-row { display: flex; gap: 0.45rem; padding: 0.4rem 0.3rem; border-bottom: 1px solid #edf1ef; }
  .m-note { margin-top: 0.7rem; border: 1px dashed var(--rule); border-radius: 6px; padding: 0.5rem 0.6rem; color: var(--ink-2); }
  .m-note b { color: var(--ink); }
  .m-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .m-btn { cursor: pointer; border: 1px solid var(--rule); background: #fff; border-radius: 6px; padding: 0.45rem 0.8rem; font-weight: 600; }
  .m-btn.ret { background: var(--stamp); color: #fff; border-color: var(--stamp); }
  .m-btn.go { background: var(--ink); color: #fff; border-color: var(--ink); }
  .m-btn:disabled { opacity: 0.45; cursor: default; }

  /* The returned stamp: the one big moment */
  .stamp {
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%) rotate(-9deg);
    border: 5px solid var(--stamp); border-radius: 10px; color: var(--stamp);
    padding: 0.35rem 1.1rem 0.45rem; text-align: center;
    font-weight: 900; font-size: 2.2rem; letter-spacing: 0.06em; line-height: 1;
    background: rgba(255, 255, 255, 0.7); pointer-events: none;
    animation: slam 0.42s cubic-bezier(.2,.9,.25,1.2) 0.9s both;
  }
  .stamp small { display: block; font-size: 0.8rem; letter-spacing: 0.02em; font-weight: 700; margin-top: 0.3rem; }
  @keyframes slam {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(-16deg) scale(1.9); }
    70% { opacity: 0.95; transform: translate(-50%, -50%) rotate(-8deg) scale(0.96); }
    100% { opacity: 0.95; transform: translate(-50%, -50%) rotate(-9deg) scale(1); }
  }

  /* Cards: problem, comparison, tests */
  .card { width: 100%; max-width: 640px; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 12px; padding: 1.5rem 1.6rem; }
  .card .lead { font-size: clamp(1.45rem, 2.6vw, 2.05rem); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 1.1rem; max-width: 22ch; padding: 0.15rem 0.2rem; }
  .card p { max-width: 60ch; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.75rem; margin: 0; padding: 0.3rem; }
  .stats div { border-top: 2px solid var(--ink); padding-top: 0.45rem; }
  .stats b { display: block; font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
  .stats span { display: block; font-size: 0.86rem; }
  .stats em { display: block; font-style: normal; font-size: 0.72rem; color: var(--ink-2); margin-top: 0.15rem; }
  .src { font-size: 0.8rem; color: var(--ink-2); margin: 0.9rem 0 0; }

  .cmp-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.75rem; align-items: center; padding: 0.6rem 0.3rem; }
  .cmp-row > b { font-size: 0.92rem; }
  .cmp-track { position: relative; height: 46px; }
  .cmp-line { position: absolute; top: 15px; height: 4px; border-radius: 2px; }
  .cmp-dot { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; border: 3px solid #fff; }
  .cmp-lab { position: absolute; top: 28px; font-size: 0.72rem; white-space: nowrap; transform: translateX(-50%); color: var(--ink-2); }
  .cmp-axis { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.75rem; font-family: var(--mono); font-size: 0.7rem; color: var(--ink-2); padding: 0 0.3rem; }
  .cmp-axis div { display: flex; justify-content: space-between; }

  .tests { width: 100%; border-collapse: collapse; margin: 0.4rem 0 0; font-size: 0.9rem; }
  .tests th, .tests td { text-align: left; vertical-align: top; padding: 0.55rem 0.5rem 0.55rem 0.3rem; border-top: 1px solid var(--rule); }
  .tests th { width: 8rem; font-weight: 700; }
  .hyp { font-size: 1.05rem; font-weight: 600; margin: 0 0 0.6rem; padding: 0.2rem; }
  .limit { padding: 0.3rem; }
  .links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.1rem; font-size: 0.9rem; margin-top: 0.8rem; }
  .links a { color: var(--check); }

  /* Spotlight and guide */
  .spot {
    position: fixed; z-index: 50; pointer-events: none;
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(16, 42, 39, 0.52);
    transition: top 0.35s ease, left 0.35s ease, width 0.35s ease, height 0.35s ease, opacity 0.2s;
  }
  .spot[hidden] { display: block; opacity: 0; }
  .spot.act::after {
    content: ""; position: absolute; inset: -4px; border-radius: 14px;
    border: 3px solid #ffd166;
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }

  .conn {
    position: fixed; z-index: 55; height: 0; pointer-events: none;
    border-top: 2px dashed #ffd166;
    transition: top 0.35s ease, left 0.35s ease, width 0.35s ease;
  }
  .conn[hidden] { display: none; }
  .guide {
    position: fixed; z-index: 60;
    width: var(--guide-w);
    background: #fff; color: var(--ink);
    border-radius: 14px;
    padding: 1rem 1.05rem 0.9rem;
    box-shadow: 0 12px 32px rgba(16, 42, 39, 0.28);
    transition: top 0.35s ease, left 0.35s ease;
  }
  .g-meta { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--ink-2); margin-bottom: 0.3rem; }
  .g-title { font-size: 1.12rem; line-height: 1.2; margin: 0 0 0.35rem; font-weight: 800; }
  .g-body { margin: 0; font-size: 0.95rem; }
  .g-quote { margin: 0.6rem 0 0; padding-left: 0.65rem; border-left: 3px solid var(--rule); font-size: 0.88rem; color: var(--ink-2); }
  .g-quote[hidden], .g-feedback[hidden], .g-skip[hidden] { display: none; }
  .g-feedback { margin: 0.6rem 0 0; font-size: 0.86rem; background: #fff6d8; border-radius: 8px; padding: 0.45rem 0.6rem; }
  .g-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.85rem; }
  .g-actions .right { display: flex; align-items: center; gap: 0.6rem; }
  .g-btn { cursor: pointer; border: 1px solid var(--ink); background: #fff; border-radius: 8px; padding: 0.42rem 0.9rem; font-weight: 600; font-size: 0.9rem; }
  .g-btn.primary { background: var(--ink); color: #fff; }
  .g-btn:disabled { visibility: hidden; }
  .g-hint { font-size: 0.86rem; font-weight: 700; color: var(--check); }
  .g-skip { background: none; border: none; padding: 0; font-size: 0.78rem; color: var(--ink-2); text-decoration: underline; cursor: pointer; }
  .g-arrow { position: absolute; width: 16px; height: 16px; background: #fff; transform: rotate(45deg); }
  .g-arrow[hidden] { display: none; }

  /* Narrow screens: no guide lane; the guide docks at the bottom */
  @media (max-width: 899px) {
    .stage { grid-template-columns: minmax(0, 1fr); padding: 1rem 0.9rem 1rem; }
    .guide { width: min(560px, calc(100vw - 24px)); }
    .top h1 { display: none; }
    .top-in { padding: 0.5rem 0.9rem; }
  }
  @media (max-width: 560px) {
    .monitor { grid-template-columns: minmax(0, 1fr); }
    .m-side { display: none; }
    .stats { grid-template-columns: minmax(0, 1fr); }
    .cmp-row, .cmp-axis { grid-template-columns: 5.5rem minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spot, .guide, .progress i { transition: none; }
    .spot.act::after { animation: none; }
    .stamp { animation: none; }
  }
</style>
</head>
<body>

<div class="banner" role="note">Prototype walkthrough. Every person, case, time and number marked "made up" is synthetic. Not a real ICA service.</div>

<header class="top">
  <div class="top-in">
    <h1>Passport Ready Check</h1>
    <nav aria-label="Chapters"><ol class="chapters" id="chapters"></ol></nav>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>

<main class="stage">
  <div class="scene-col">
    <div class="context" id="context">
      <span class="who" id="who"></span>
      <span class="clock" id="t-clock"><b id="clockDay"></b> <span id="clockTime"></span></span>
    </div>
    <div class="scene" id="scene"></div>
  </div>
</main>

<div class="spot" id="spot" hidden></div>
<div class="conn" id="conn" hidden aria-hidden="true"></div>

<section class="guide" id="guide" role="region" aria-label="Guide" aria-live="polite">
  <div class="g-meta"><span id="gChapter"></span><span id="gCount"></span></div>
  <h2 class="g-title" id="gTitle"></h2>
  <p class="g-body" id="gBody"></p>
  <p class="g-quote" id="gQuote" hidden></p>
  <p class="g-feedback" id="gFeedback" hidden></p>
  <div class="g-actions">
    <button type="button" class="g-btn" id="gBack">Back</button>
    <div class="right">
      <span class="g-hint" id="gHint"></span>
      <button type="button" class="g-skip" id="gSkip" hidden>Skip</button>
      <button type="button" class="g-btn primary" id="gNext">Next</button>
    </div>
  </div>
  <i class="g-arrow" id="gArrow" hidden></i>
</section>

<noscript><p style="padding:1rem">This walkthrough needs JavaScript. The plain screens are in index.html and index-lean.html.</p></noscript>

<script>
(function () {
  "use strict";

  /* ---------------- Scenes ---------------- */
  var QUESTIONS = {
    2: { q: "Is your child a Singapore citizen?", a: [["yes", "Yes"], ["no", "No"], ["unsure", "Not sure"]] },
    3: { q: "Can both parents give consent?", a: [["yes", "Yes"], ["no", "No"], ["unsure", "Not sure"]] },
    4: { q: "Is either parent overseas right now?", a: [["no", "No"], ["yes", "Yes"], ["unsure", "Not sure"]] }
  };
  var ANSWERED = { 1: "Renewal of my child's passport", 2: "Yes, a Singapore citizen", 3: "Yes, both can give consent", 4: "No, neither is overseas" };

  function desk(rows, note, footer, buttons) {
    return '<div class="desk"><div class="monitor">' +
      '<div class="m-side"><p>Child applications today</p><ol>' +
        '<li class="on">C-0417 renewal</li><li>C-0418 first passport</li><li>C-0419 renewal</li><li class="more">and 497 more (made up)</li>' +
      '</ol></div>' +
      '<div class="m-main"><h3>C-0417, child renewal (made up)</h3>' + rows + note +
        '<div class="m-actions">' + buttons + '</div>' + footer +
      '</div></div><div class="stand"></div></div>';
  }

  var SCENES = {
    problem: function () {
      return '<div class="card">' +
        '<p class="lead" id="t-lead">Parents renewing a child\'s passport find out what "complete" means six days too late.</p>' +
        '<div class="stats" id="t-stats">' +
          '<div><b>26%</b><span>of child applications come back</span><em>made up</em></div>' +
          '<div><b>6 days</b><span>added by each return</span><em>course brief</em></div>' +
          '<div><b>38%</b><span>of applicants read the guidance</span><em>course brief</em></div>' +
        '</div>' +
        '<p class="src">The most common reason a child\'s application comes back is missing consent from the second parent (made up).</p>' +
        '</div>';
    },

    today: function (st) {
      return '<div class="phone">' +
        '<div class="p-app">Passport application (made up)</div>' +
        '<p class="p-h">Review and submit</p>' +
        '<p class="p-sub">Renewal for a child under 16</p>' +
        '<ul class="p-list">' +
          '<li><span class="ok">✓</span>Child\'s current passport uploaded</li>' +
          '<li><span class="ok">✓</span>Passport photo uploaded</li>' +
        '</ul>' +
        '<button type="button" class="p-link" id="t-guidance" data-act="guidance">Guidance for all applicants (one long page)</button>' +
        (st.submitted
          ? '<div class="toast">Submitted. An officer will review your application.</div>'
          : '<button type="button" class="p-btn" id="t-submit" data-act="submit">Submit application</button>') +
        '</div>';
    },

    deskReturn: function (st) {
      var rows =
        '<div class="m-row"><span class="ok">✓</span>Child\'s current passport</div>' +
        '<div class="m-row"><span class="ok">✓</span>Passport photo</div>' +
        '<div class="m-row" id="t-missing"><span class="no">✗</span>Second parent\'s consent not received</div>';
      var note = st.returned
        ? '<div class="m-note"><b>Return notice sent.</b> Your application is incomplete. The second parent\'s consent was not received. Please ask them to give consent online and submit again.</div>'
        : '';
      var buttons = '<button type="button" class="m-btn ret" id="t-return" data-act="return"' + (st.returned ? ' disabled' : '') + '>Return to applicant</button>' +
                    '<button type="button" class="m-btn" data-act="approve-wrong"' + (st.returned ? ' disabled' : '') + '>Approve</button>';
      return desk(rows, note, '', buttons);
    },

    notice: function () {
      return '<div class="phone">' +
        '<div class="p-app">Passport application (made up)</div>' +
        '<p class="p-h">Your application has been returned</p>' +
        '<ul class="p-list"><li><span class="no">✗</span>The second parent\'s consent was not received.</li></ul>' +
        '<p class="p-sub">Ask the other parent to give consent online, then submit again. Your application goes back into the queue.</p>' +
        '<button type="button" class="p-btn" data-act="start-again">Submit again</button>' +
        '<div class="stamp" aria-hidden="true">RETURNED<small>about six days lost</small></div>' +
        '</div>';
    },

    q1: function (st) {
      var a = [["renewal", "Renewal of my child's passport"], ["first", "My child's first passport"], ["lost", "Replacing a lost or damaged passport"], ["unsure", "Not sure"]];
      return '<div class="phone">' +
        '<div class="p-app">Review your application (made up)</div>' +

    var pad = 8;
    spot.hidden = false;
    spot.style.top = (r.top - pad) + "px";
    spot.style.left = (r.left - pad) + "px";
    spot.style.width = (r.width + pad * 2) + "px";
    spot.style.height = (r.height + pad * 2) + "px";

    var gw = g.offsetWidth, gh = g.offsetHeight;
    var vw = window.innerWidth, vh = window.innerHeight;
    arrow.hidden = false;
    arrow.style.left = arrow.style.top = arrow.style.right = arrow.style.bottom = "";

    if (narrow()) {
      // Sit just below the target if it fits, otherwise just above it, otherwise dock at the bottom.
      var nx = Math.round((vw - gw) / 2), ny, cx = r.left + r.width / 2;
      var below = r.bottom + pad + 16, above = r.top - pad - 16 - gh;
      if (below + gh <= vh - 8) { ny = below; arrow.style.top = "-8px"; }
      else if (above >= 70) { ny = above; arrow.style.bottom = "-8px"; }
      else { ny = vh - gh - 12; arrow.hidden = true; }
      arrow.style.left = Math.max(18, Math.min(gw - 34, cx - nx - 8)) + "px";
      g.style.left = nx + "px";
      g.style.top = ny + "px";
      return;
    }

    var gap = 20, x, y, side;
    var cy = r.top + r.height / 2, cxx = r.left + r.width / 2;
    // Prefer the guide lane to the right of the whole scene, so the guide never covers the device.
    var dev = document.querySelector("#scene > *");
    var dr = dev ? dev.getBoundingClientRect() : r;
    var laneX = Math.max(r.right, dr.right) + pad + gap;
    if (laneX + gw <= vw - 12) {
      x = laneX;
      y = Math.max(70, Math.min(vh - gh - 12, cy - gh / 2));
      arrow.style.top = Math.max(16, Math.min(gh - 32, cy - y - 8)) + "px";
      arrow.style.left = "-8px";
      // A connector from the spotlight edge to the guide when they're apart.
      var conn = $("conn");
      var from = r.right + pad, to = x;
      if (to - from > 14) {
        conn.hidden = false;
        conn.style.left = from + "px";
        conn.style.top = cy + "px";
        conn.style.width = (to - from) + "px";
      } else conn.hidden = true;
      g.style.left = x + "px";
      g.style.top = y + "px";
      return;
    }
    $("conn").hidden = true;
    if (r.right + pad + gap + gw <= vw - 12) side = "right";
    else if (r.left - pad - gap - gw >= 12) side = "left";
    else if (r.bottom + pad + gap + gh <= vh - 12) side = "bottom";
    else side = "top";

    if (side === "right" || side === "left") {
      x = side === "right" ? r.right + pad + gap : r.left - pad - gap - gw;
      y = Math.max(70, Math.min(vh - gh - 12, cy - gh / 2));
      arrow.style.top = Math.max(16, Math.min(gh - 32, cy - y - 8)) + "px";
      arrow.style[side === "right" ? "left" : "right"] = "-8px";
    } else {
      x = Math.max(12, Math.min(vw - gw - 12, cxx - gw / 2));
      y = side === "bottom" ? r.bottom + pad + gap : Math.max(12, r.top - pad - gap - gh);
      arrow.style.left = Math.max(16, Math.min(gw - 32, cxx - x - 8)) + "px";
      arrow.style[side === "bottom" ? "top" : "bottom"] = "-8px";
    }
    g.style.left = x + "px";
    g.style.top = y + "px";
  }

  /* Clicks inside the scene */
  $("scene").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.disabled || busy) return;
    var act = b.getAttribute("data-act");
    var s = STEPS[cur];
    var a = currentAction();

    // "What we checked" opens on any screen that has it.
    var toggled = false;
    if (act === "more") {
      state.more = !state.more;
      renderScene();
      focusTarget(false);
      toggled = true;
    }

    if (a && act === a.act) {
      if (s.seq) {
        seqIdx += 1;
        if (seqIdx < s.seq.length) {
          state.q = s.seq[seqIdx].q;
          renderScene();
          $("gHint").textContent = s.seq[seqIdx].hint;
          $("gFeedback").hidden = true;
          focusTarget(false);
          return;
        }
        succeed(s.done);
        return;
      }
      if (a.set) for (var k in a.set) state[k] = a.set[k];
      renderScene();
      succeed(a.done);
      return;
    }

    if (s.off && s.off[act]) { feedback(s.off[act]); return; }
    if (GENERIC[act]) { feedback(GENERIC[act] + (a ? " " + a.hint + " to continue." : " Press Next to continue.")); return; }
    if (a) { feedback("Not this one. " + a.hint + " to continue."); return; }
    if (!toggled) feedback("This screen is for looking. Press Next to continue.");
  });

  var GENERIC = {
    more: "That shows what the check looked at, one tap away so the screen stays simple.",
    anyway: "Submit anyway is always there, because the check is a guide, not a gate.",
    guidance: "That's the one long page for every case."
  };

  function succeed(msg) {
    busy = true;
    pending = false;
    $("spot").classList.remove("act");
    $("gHint").textContent = "";
    $("gSkip").hidden = true;
    feedback(msg);
    focusTarget(false);
    setTimeout(function () { if (busy) next(); }, reduced ? 900 : 1500);
  }

  $("gNext").addEventListener("click", next);
  $("gBack").addEventListener("click", function () { go(cur - 1); });
  $("gSkip").addEventListener("click", next);
  document.addEventListener("keydown", function (e) {
    if (e.target && /^(A|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") {
      e.preventDefault();
      if (pending) feedback(currentAction().hint + " to continue, or press Skip.");
      else if (!busy) next();
    } else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
  });

  var raf = 0;
  function onMove() { cancelAnimationFrame(raf); raf = requestAnimationFrame(place); }
  window.addEventListener("scroll", onMove, { passive: true });
  window.addEventListener("resize", function () { focusTarget(true); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { place(); });

  buildChapters();
  var start = parseInt((location.hash.match(/step=(\d+)/) || [])[1], 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
